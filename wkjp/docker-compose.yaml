# WaniKani listening practice on the wkjp VM. Reconciled by wkjp-sync from
# this directory. The gateway (pfe, same VLAN) proxies wkjp.labxp.io to :80.
# VOICEVOX is only reachable through nginx's /vv/ allowlist.
name: wkjp

services:
  app:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Directories, not files: rsync replaces files, and a file bind mount
      # would keep the old copy.
      - ./site:/usr/share/nginx/html:ro
      - ./nginx:/etc/nginx/conf.d:ro
      # Pronunciation check recordings (nginx /rec/). Outside the synced
      # tree so rsync --delete leaves them alone.
      - /opt/wkjp/rec:/srv/rec
    depends_on:
      - voicevox

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    restart: unless-stopped

  # ReazonSpeech for spoken reading answers (CPU, see asr/server.py). Only
  # nginx's /asr/transcribe reaches it. Built here, never pulled: the build
  # is cached, so the sync's `up` is a no-op until asr/ changes.
  asr:
    build: ./asr
    image: wkjp-asr:local
    pull_policy: build
    restart: unless-stopped
    environment:
      THREADS: "2"
    mem_limit: 1g
