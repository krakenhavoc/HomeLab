server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only the endpoints the app uses. VOICEVOX 403s any Origin it doesn't
    # know, so drop it; same-origin requests don't need CORS anyway.
    location ~ ^/vv/(speakers|audio_query|synthesis|version)$ {
        rewrite ^/vv(/.*)$ $1 break;
        proxy_pass http://voicevox:50021;
        proxy_set_header Origin "";
        proxy_read_timeout 120s;
    }

    location /vv/ {
        return 404;
    }
}
