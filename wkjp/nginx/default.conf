# Speech runs on base-station (192.168.1.18, ~/llm/local-compose.yaml there):
# VOICEVOX on its CPU (~0.3 s a sentence, ~30x this 2-vCPU VM) and Whisper on
# its GPU (~0.1 s a clip). KBU's GPU overheats and kept pausing Whisper, so KBU
# is now only Whisper's backup, and the VM's own VOICEVOX is VOICEVOX's.
# A server that doesn't connect within the location's connect timeout is
# skipped for 30 s. X-Served-By on the response says which one answered.
upstream voicevox_engine {
    server 192.168.1.18:50121 max_fails=1 fail_timeout=30s;
    server voicevox:50021 backup;
}

upstream whisper_stt {
    server 192.168.1.18:8080 max_fails=1 fail_timeout=30s;
    server 192.168.1.201:8080 backup;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # behind Caddy; relative Location keeps https
    absolute_redirect off;
    # index.html is ~200 KB and emoji.json ~220 KB; both shrink to a third.
    # Every request comes through Caddy, which adds Via, and nginx doesn't
    # compress proxied requests unless told to.
    gzip on;
    gzip_proxied any;
    gzip_types application/json text/css application/javascript image/svg+xml;

    # old filename from the desktop setup
    location = /wanikani_listening_practice.html {
        return 301 /;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Only the endpoints the app uses. VOICEVOX 403s any Origin it doesn't
    # know, so drop it; same-origin requests don't need CORS anyway.
    location ~ ^/vv/(speakers|audio_query|synthesis|version)$ {
        rewrite ^/vv(/.*)$ $1 break;
        proxy_pass http://voicevox_engine;
        proxy_set_header Origin "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 120s;
        add_header X-Served-By $upstream_addr always;
    }

    # base URL isn't a page; show the engine version instead of a 404
    location ~ ^/vv/?$ {
        return 302 /vv/version;
    }

    location /vv/ {
        return 404;
    }

    # Talk tab: Ollama on base-station's GPU. Off when that PC is off; the
    # app shows the 502. Ollama 403s non-local Origins, so drop it here too.
    location ~ ^/llm/api/(chat|tags)$ {
        rewrite ^/llm(/.*)$ $1 break;
        proxy_pass http://192.168.1.18:11434;
        proxy_set_header Origin "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        client_max_body_size 1m;
    }

    location /llm/ {
        return 404;
    }

    # Talk: Claude through Anthropic's API, the default conversation partner.
    # The key never reaches the browser: nginx adds it from
    # /opt/wkjp/secrets/claude.conf on the VM (one line, not in git:
    #   set $claude_key "sk-ant-...";
    # see the README). Without that file this answers 503 and the app falls
    # back to Ollama. The site is LAN-only; cap spend in the Anthropic Console.
    location = /claude/v1/messages {
        limit_except POST { deny all; }
        set $claude_key "";
        include /etc/nginx/secrets/*.conf;
        if ($claude_key = "") {
            return 503;
        }
        # resolved per request, so nginx starts even when DNS is down
        resolver 127.0.0.11 valid=300s ipv6=off;
        set $anthropic api.anthropic.com;
        proxy_pass https://$anthropic/v1/messages;
        proxy_ssl_server_name on;
        proxy_ssl_name api.anthropic.com;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host api.anthropic.com;
        proxy_set_header x-api-key $claude_key;
        # only what the API needs from the browser
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        client_max_body_size 1m;
        # Talk streams replies (server-sent events): pass each piece on as it
        # comes instead of holding the whole answer back
        proxy_buffering off;
    }

    location /claude/ {
        return 404;
    }

    # Speech-to-text: whisper.cpp on base-station's GPU, KBU as backup.
    location = /stt/v1/audio/transcriptions {
        rewrite ^/stt(/.*)$ $1 break;
        proxy_pass http://whisper_stt;
        proxy_set_header Origin "";
        add_header X-Served-By $upstream_addr always;
        proxy_connect_timeout 3s;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    location /stt/ {
        return 404;
    }

    # Reading answers: ReazonSpeech on this VM (asr service). Resolved per
    # request through Docker's DNS, so nginx still starts if asr is missing
    # or restarting; the app then uses Whisper alone.
    location = /asr/transcribe {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $asr http://asr:8000;
        proxy_pass $asr/transcribe;
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        client_max_body_size 10m;
    }

    location /asr/ {
        return 404;
    }

    # Pronunciation check takes, kept for Whisper tuning: the page PUTs each
    # clip and its session.json. /opt/wkjp/rec on the VM, outside the synced
    # tree; wkjp-sync makes it writable by nginx and prunes old sessions.
    # NN-T for check takes, NNNN-1 for review answers
    location ~ "^/rec/\d{8}-\d{6}/(\d{2,4}-\d{1,2}\.(webm|ogg|mp4)|session\.json)$" {
        root /srv;
        limit_except GET PUT { deny all; }
        dav_methods PUT;
        create_full_put_path on;
        dav_access user:rw group:r all:r;
        client_max_body_size 2m;
        client_body_temp_path /srv/rec/.tmp;
    }

    location ~ "^/rec/(\d{8}-\d{6}/)?$" {
        root /srv;
        limit_except GET { deny all; }
        autoindex on;
        autoindex_format json;
    }

    location /rec/ {
        return 404;
    }

    # The learner's picture choices for items: one JSON the app reads, merges
    # its change into and PUTs back. Kept (not pruned) in /opt/wkjp/pics.
    location = /pics/picks.json {
        root /srv;
        limit_except GET PUT { deny all; }
        dav_methods PUT;
        dav_access user:rw group:r all:r;
        client_max_body_size 1m;
        client_body_temp_path /srv/pics/.tmp;
        add_header Cache-Control "no-store" always;
    }

    location /pics/ {
        return 404;
    }

    # Practice-time log: one file per browser (time-<random id>.json), each
    # written only by that browser, so devices never overwrite each other. The
    # Stats tab reads the listing and adds them up. Kept in /opt/wkjp/stats.
    location ~ "^/stats/time-[a-f0-9]{16}\.json$" {
        root /srv;
        limit_except GET PUT { deny all; }
        dav_methods PUT;
        dav_access user:rw group:r all:r;
        client_max_body_size 256k;
        client_body_temp_path /srv/stats/.tmp;
        add_header Cache-Control "no-store" always;
    }

    location = /stats/ {
        root /srv;
        limit_except GET { deny all; }
        autoindex on;
        autoindex_format json;
        add_header Cache-Control "no-store" always;
    }

    location /stats/ {
        return 404;
    }

    # Words the learner has started in Anki (Kaishi 1.5k), sent by
    # wkjp/tools/anki-sync.py from base-station every 15 minutes when they
    # change; Talk and the dictionary count them as known. In /opt/wkjp/anki.
    location = /anki/known.json {
        root /srv;
        limit_except GET PUT { deny all; }
        dav_methods PUT;
        dav_access user:rw group:r all:r;
        client_max_body_size 1m;
        client_body_temp_path /srv/anki/.tmp;
        add_header Cache-Control "no-store" always;
    }

    location /anki/ {
        return 404;
    }
}
