---
# The portal's links. See https://gethomepage.dev/configs/services/
#
# Descriptions say what a thing is FOR, not where it lives. Addresses used to
# be in here and are deliberately gone: the point of the gateway is that
# nobody needs to know an IP, and repeating them on every card both undoes
# that and dates the page the moment a host moves.
#
# siteMonitor drives the status dot. It is a plain reachability check from the
# Homepage container, so it needs the firewall to allow pfe -> target. Several
# point at a path rather than the root, because a service's root is rarely its
# health endpoint -- RedLib answers / with 404 by design and Plex with 401, so
# monitoring / on either reports a working service as down.
#
# WIDGETS AND SECRETS
# Every {{HOMEPAGE_VAR_x}} below is read from the environment, never from this
# file -- this repository is public. They arrive via /etc/gateway/homepage.env,
# written once by cloud-init from a single Terraform variable. Until that file
# has values the affected cards show an API error rather than statistics; the
# card, link and status dot still work.
#
# Verified empirically that {{HOMEPAGE_VAR_x}} is the substitution Homepage
# honours. The documentation also shows ${x}, which silently does not expand
# and renders the literal text instead.
#
# Widget URLs point at gateway names where the upstream serves a self-signed
# certificate (Proxmox, Pi-hole), because Caddy already fronts those with a
# real one and Homepage will not talk to an untrusted certificate. Where the
# upstream speaks plain HTTP (Plex, Home Assistant) they go direct, which is
# one hop fewer and avoids the Host rewriting the proxy does.

- Infrastructure:
    - Proxmox:
        href: https://proxmox.labxp.io
        siteMonitor: https://proxmox.labxp.io
        description: Hypervisor — VMs, storage, console
        icon: proxmox.png
        widget:
          type: proxmox
          url: https://proxmox.labxp.io
          # username is the token ID in "user@realm!tokenname" form, and
          # password is the token secret -- not an account password.
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
          fields: ["vms", "lxc", "resources.cpu", "resources.mem"]

    - Pi-hole:
        href: https://dns01.labxp.io
        siteMonitor: https://dns01.labxp.io
        widget:
          type: pihole
          url: https://dns01.labxp.io
          # v6 replaced the old API token with an app password, generated in
          # Settings -> Web interface / API.
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE1_KEY}}"
          fields: ["queries", "blocked", "blocked_percent"]
        description: DNS and ad filtering — primary
        icon: pi-hole.png

    - Pi-hole (secondary):
        href: https://dns02.labxp.io
        siteMonitor: https://dns02.labxp.io
        widget:
          type: pihole
          url: https://dns02.labxp.io
          # v6 replaced the old API token with an app password, generated in
          # Settings -> Web interface / API.
          version: 6
          key: "{{HOMEPAGE_VAR_PIHOLE2_KEY}}"
          fields: ["queries", "blocked", "blocked_percent"]
        description: DNS and ad filtering — failover
        icon: pi-hole.png

    - iDRAC:
        href: https://idrac.labxp.io
        # /start.html, not /. The root is a 302 to it, and following a
        # redirect chain is a slower check than asking for the page it lands
        # on.
        siteMonitor: https://idrac.labxp.io/start.html
        description: Out-of-band management — Proxmox host
        icon: mdi-server-network-outline

- Media:
    - Plex:
        # /web is the UI; the bare root serves the API.
        href: https://plex.labxp.io/web
        # /identity is unauthenticated by design -- it is what Plex clients
        # use to discover a server before they have credentials for it.
        siteMonitor: https://plex.labxp.io/identity
        description: Films and television
        icon: plex.png
        widget:
          type: plex
          # Direct, not through the gateway: Plex speaks plain HTTP here, so
          # there is no certificate to trust and no Host rewriting involved.
          url: http://192.168.10.10:32400
          key: "{{HOMEPAGE_VAR_PLEX_TOKEN}}"
          fields: ["streams", "movies", "tv"]

    - RedLib:
        href: https://redlib.labxp.io
        # /settings, not /. RedLib has no landing page and answers / with 404.
        siteMonitor: https://redlib.labxp.io/settings
        description: Private Reddit frontend
        icon: redlib.png

    - qBittorrent:
        href: https://torrent.labxp.io
        siteMonitor: https://torrent.labxp.io
        description: Torrent client — bound to the VPN tunnel
        icon: qbittorrent.png
        widget:
          type: qbittorrent
          # Direct rather than through the gateway. The widget polls every
          # few seconds and this keeps it off the proxy path entirely, which
          # also means the card still reports when Caddy is the thing that is
          # unhappy.
          url: http://192.168.1.201:8000
          username: "{{HOMEPAGE_VAR_QBIT_USERNAME}}"
          password: "{{HOMEPAGE_VAR_QBIT_PASSWORD}}"
          fields: ["leech", "download", "seed", "upload"]

- Automation:
    - Home Assistant:
        href: https://hom01.labxp.io
        siteMonitor: https://hom01.labxp.io
        description: Home automation and sensors
        icon: home-assistant.png
        widget:
          type: homeassistant
          url: http://192.168.1.15:8123
          # A long-lived access token from the user's profile page, not a
          # password and not the onboarding token.
          key: "{{HOMEPAGE_VAR_HASS_TOKEN}}"
          fields: ["people_home", "lights_on", "switches_on"]

    - OpenClaw:
        href: https://orca.labxp.io
        # /health, not /. The root serves the Control UI shell, which renders a
        # 200 whether or not the gateway behind it is healthy -- including
        # while it is still loading plugins and refusing connections, which is
        # exactly the window you want a status dot to notice. /health is the
        # process answering for itself.
        siteMonitor: https://orca.labxp.io/health
        widget:
          # customapi because there is no OpenClaw widget, and /health is the
          # only JSON this gateway serves over HTTP. Everything the Control UI
          # displays -- models, sessions, agent identity -- arrives over a
          # websocket, which Homepage cannot consume. One honest field beats an
          # empty card, and it distinguishes "Caddy answered" from "the gateway
          # is live".
          type: customapi
          url: https://orca.labxp.io/health
          refreshInterval: 30000
          mappings:
            - field: status
              label: Gateway
              format: text
              remap:
                - value: live
                  to: Live
                - any: true
                  to: Degraded
        description: Agent gateway — default profile
        icon: mdi-robot-outline

    - OpenClaw (work):
        href: https://workai.labxp.io
        # /health, not /. The root serves the Control UI shell, which renders a
        # 200 whether or not the gateway behind it is healthy -- including
        # while it is still loading plugins and refusing connections, which is
        # exactly the window you want a status dot to notice. /health is the
        # process answering for itself.
        siteMonitor: https://workai.labxp.io/health
        widget:
          # customapi because there is no OpenClaw widget, and /health is the
          # only JSON this gateway serves over HTTP. Everything the Control UI
          # displays -- models, sessions, agent identity -- arrives over a
          # websocket, which Homepage cannot consume. One honest field beats an
          # empty card, and it distinguishes "Caddy answered" from "the gateway
          # is live".
          type: customapi
          url: https://workai.labxp.io/health
          refreshInterval: 30000
          mappings:
            - field: status
              label: Gateway
              format: text
              remap:
                - value: live
                  to: Live
                - any: true
                  to: Degraded
        # A different glyph from the default profile on purpose. Two identical
        # robot icons side by side made the only difference between them the
        # word in brackets.
        description: Agent gateway — work profile
        icon: mdi-robot-industrial

- Apps:
    - LastDash:
        href: https://lastdash.labxp.io
        # /api/healthz is the API's liveness route; the root would only prove
        # the web app is up.
        siteMonitor: https://lastdash.labxp.io/api/healthz
        description: Unified inbox — Slack, Teams, GitHub and more
        icon: mdi-inbox-multiple-outline

- Games:
    - cmd_and_ctrl:
        href: https://cmd.labxp.io
        siteMonitor: https://cmd.labxp.io
        description: Game server — production
        icon: mdi-cards-playing-outline

    - cmd_and_ctrl (develop):
        href: https://cmd-dev.labxp.io
        siteMonitor: https://cmd-dev.labxp.io
        description: Game server — develop preview
        icon: mdi-cards-playing-outline
