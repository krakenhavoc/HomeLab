---
# The portal's links. See https://gethomepage.dev/configs/services/
#
# Two kinds of entry live here, and the difference matters:
#
#   * Names ending in .labxp.io that Caddy serves (proxmox, redlib, and the
#     portal itself). These have real certificates and resolve through
#     Pi-hole to 192.168.201.14.
#
#   * Direct http://IP:port links to things not yet behind the proxy. They
#     work, they just show the usual browser warnings and depend on the
#     address staying put. Moving one behind the proxy is a Caddyfile block,
#     two Pi-hole records and a firewall rule -- see gateway/README.md.
#
# siteMonitor drives the status dot. It is a plain reachability check from
# the Homepage container, so it needs the firewall to allow pfe -> target.

- Infrastructure:
    - Proxmox:
        href: https://proxmox.labxp.io
        siteMonitor: https://proxmox.labxp.io
        description: Hypervisor — VMs, storage, console
        icon: proxmox.png

    - Pi-hole (dns01):
        href: https://dns01.labxp.io
        siteMonitor: https://dns01.labxp.io
        description: DNS and ad filtering — 192.168.10.11
        icon: pi-hole.png

    - Pi-hole (dns02):
        href: https://dns02.labxp.io
        siteMonitor: https://dns02.labxp.io
        description: DNS and ad filtering — 192.168.10.12
        icon: pi-hole.png

- Applications:
    - RedLib:
        href: https://redlib.labxp.io
        siteMonitor: https://redlib.labxp.io
        description: Private Reddit frontend
        icon: redlib.png

    - Plex:
        href: https://plex.labxp.io
        siteMonitor: https://plex.labxp.io
        description: Media server — 192.168.10.10
        icon: plex.png

- Lab:
    - cmd_and_ctrl:
        href: https://cmd.labxp.io
        siteMonitor: https://cmd.labxp.io
        description: Game server — production
        icon: mdi-cards-playing-outline

    - cmd_and_ctrl (develop):
        href: https://cmd-dev.labxp.io
        siteMonitor: https://cmd-dev.labxp.io
        description: Game server — develop preview
        icon: mdi-cards-playing-outline
