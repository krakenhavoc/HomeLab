---
# Header widgets. See https://gethomepage.dev/widgets/
#
# Deliberately minimal. The service widgets that pull live stats from Proxmox,
# Plex and Pi-hole each need an API token, and those are real credentials that
# would have to be seeded into /etc/gateway from Terraform rather than kept
# here -- this file is in a public repository. Resource, search and datetime
# need none.

- resources:
    label: pfe
    backend: resources
    expanded: true
    cpu: true
    memory: true
    disk: /

- search:
    provider: duckduckgo
    focus: false
    target: _blank

- datetime:
    text_size: xl
    format:
      dateStyle: long
      timeStyle: short
      hourCycle: h23
