# blackbox_exporter on the cmd_and_ctrl monitoring VM (cmd_and_ctrl ADR 0123
# §7). Prometheus's "blackbox" job probes both /healthz URLs with this module.

modules:
  http_2xx:
    prober: http
    # Under Prometheus's 15 s scrape_timeout.
    timeout: 10s
    http:
      method: GET
      # Empty means any 2xx.
      valid_status_codes: []
      preferred_ip_protocol: ip4
      fail_if_not_ssl: true
