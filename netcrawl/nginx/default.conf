# NetCrawl web build. The gateway (pfe, same VLAN) terminates TLS and
# proxies netcrawl-dev.labxp.io here. See docs/netcrawl-web.md.
#
# Layout, written by NetCrawl CI over its write-only deploy key:
#   www/index.html     redirect to the current release; replaced atomically
#   www/r/<sha>/       one Godot web export, never modified after upload
#
# Godot names every export index.*, so per-release directories are what stop
# a browser from pairing a cached index.pck with a newer index.wasm. That is
# also why everything under /r/ can be cached forever.

server {
    listen 80;
    root /srv/netcrawl/www;
    index index.html;
    # Behind Caddy; relative Location keeps https.
    absolute_redirect off;
    server_tokens off;
    # CI ships .gz next to the large files; nginx doesn't compress on the fly,
    # and neither does the gateway.
    gzip_static on;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # add_header in a location replaces the server's headers rather than
    # adding to them, so every location that sets Cache-Control includes the
    # shared set itself.
    location = / {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    location = /index.html {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-cache" always;
    }

    # No `always` on the immutable header: a 404 here must not be cached, or a
    # browser keeps it for a year after a release is pruned.
    location /r/ {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri $uri/ =404;
    }

    # Only the newest few releases are kept (netcrawl-sync), but the root
    # redirect leaves /r/<sha>/ in the address bar, history and bookmarks. A
    # pruned release's entry page sends the visitor to the current build.
    location ~ "^/r/[0-9a-f]{7,40}/(index\.html)?$" {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        # ${uri}index.html covers the bare /r/<sha>/ form.
        try_files $uri ${uri}index.html @current;
    }

    location @current {
        include /etc/nginx/conf.d/headers.inc;
        add_header Cache-Control "no-store" always;
        return 302 /;
    }

    location / {
        return 404;
    }
}
