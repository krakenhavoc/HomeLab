name: Terraform CD

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Working directory for Terraform commands"
        required: true
        type: string
      environment:
        description: "GitHub environment (lab, dev, prd, platform, ...)"
        required: true
        type: string
      runner:
        description: "GitHub runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
      enable_proxmox_ssh:
        description: "Start ssh-agent and add Proxmox key"
        required: false
        type: boolean
        default: false
      terraform_version:
        description: "Terraform version to use"
        required: false
        type: string
        default: "1.14.3"
      workspace:
        description: "Terraform Cloud workspace name"
        required: false
        type: string
        default: ""
      plan_artifact_name:
        description: "Name of the plan artifact to download"
        required: true
        type: string
      plan_run_id:
        description: "Run that uploaded the plan; defaults to this run"
        required: false
        type: string
        default: ""
    # Callers pass `secrets: inherit`.

permissions:
  contents: read
  actions: read

jobs:
  apply:
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    # Never from a PR. The 2026-09-10 incident was a PR run applying to lab.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: tf-${{ inputs.workspace || inputs.environment }}
      cancel-in-progress: false
    env:
      TF_WORKSPACE: ${{ inputs.workspace || inputs.environment }}
      NODE_OPTIONS: "--no-network-family-autoselection"
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      PROXMOX_VE_PASSWORD: ${{ secrets.PROXMOX_VE_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up SSH for Proxmox Provider
        if: inputs.enable_proxmox_ssh == true
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_proxmox
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Download TF Plan
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.plan_artifact_name }}
          path: ${{ inputs.working_directory }}
          run-id: ${{ inputs.plan_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          cli_config_credentials_token: ${{ secrets.HCP_API_TOKEN }}

      - name: Terraform Init
        working-directory: ${{ inputs.working_directory }}
        run: terraform init -input=false

      - name: Decrypt TF Plan
        working-directory: ${{ inputs.working_directory }}
        env:
          PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -pass env:PLAN_ENCRYPTION_KEY \
            -in tfplan-${{ inputs.workspace || inputs.environment }}.enc -out tfplan-${{ inputs.workspace || inputs.environment }}

      # A plan made before another apply to this workspace fails as stale.
      - name: Terraform Apply
        working-directory: ${{ inputs.working_directory }}
        run: terraform apply -input=false tfplan-${{ inputs.workspace || inputs.environment }}

      - name: Remove plaintext plan
        if: always()
        working-directory: ${{ inputs.working_directory }}
        run: rm -f tfplan-${{ inputs.workspace || inputs.environment }}
