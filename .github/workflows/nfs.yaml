name: NFS CI/CD

permissions:
  contents: read
  pull-requests: write

on:
  push:
    paths:
      - "terraform/deployments/nfs/**"
      - ".github/workflows/nfs.yaml"
      - ".github/workflows/terraform-ci.yaml"
      - ".github/workflows/terraform-cd.yaml"
    branches:
      - main
  pull_request:
    paths:
      - "terraform/deployments/nfs/**"
      - ".github/workflows/nfs.yaml"
      - ".github/workflows/terraform-ci.yaml"
      - ".github/workflows/terraform-cd.yaml"

env:
  PROXMOX_VE_API_TOKEN: ${{ secrets.PVE_ROOT_PASSWORD }}

jobs:
  nfs-ci:
    strategy:
      matrix:
        environment: ["nfs-dev", "nfs-prd"]
    uses: KrakenHavoc/HomeLab/.github/workflows/terraform-ci.yaml@main
    with:
      working_directory: terraform/deployments/nfs
      var_file_path: env/${{ matrix.environment }}/terraform.tfvars
      environment: ${{ matrix.environment }}
      runner: self-hosted
      enable_proxmox_ssh: false
      terraform_vars: "-var=ssh_public_key='${{ vars.SSH_PUBLIC_KEY }}'"
    secrets:
      hcp_api_token: ${{ secrets.HCP_API_TOKEN }}
      proxmox_ve_password: ${{ secrets.PVE_ROOT_PASSWORD }}

  nfs-cd:
    needs: nfs-ci
    # Apply ONLY on a merge to main. terraform-cd gates on
    # `!contains(inputs.environment, 'prd')`, which is always true for a
    # non-prd environment, so without this the apply ran on every
    # pull_request push -- an unreviewed plan applied to live
    # infrastructure. That destroyed the production cmd_and_ctrl VM from an
    # open PR on 2026-09-10. Plan still runs on PRs; only apply is gated.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        environment: ["nfs-dev", "nfs-prd"]
    uses: KrakenHavoc/HomeLab/.github/workflows/terraform-cd.yaml@main
    with:
      working_directory: terraform/deployments/nfs
      environment: ${{ matrix.environment }}
      runner: self-hosted
      plan_artifact_name: tf-plan-${{ matrix.environment }}
      enable_proxmox_ssh: false
    secrets:
      hcp_api_token: ${{ secrets.HCP_API_TOKEN }}
      proxmox_ve_password: ${{ secrets.PVE_ROOT_PASSWORD }}
