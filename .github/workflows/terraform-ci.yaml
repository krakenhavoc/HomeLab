name: Terraform CI

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Working directory for Terraform commands"
        required: true
        type: string
      var_file_path:
        description: "Path to tfvars file relative to working directory"
        required: true
        type: string
      environment:
        description: "GitHub environment (lab, dev, prd, platform, ...)"
        required: true
        type: string
      runner:
        description: "GitHub runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
      enable_proxmox_ssh:
        description: "Start ssh-agent and add Proxmox key"
        required: false
        type: boolean
        default: false
      terraform_version:
        description: "Terraform version to use"
        required: false
        type: string
        default: "1.14.3"
      workspace:
        description: "Terraform Cloud workspace name"
        required: false
        type: string
        default: ""
      terraform_vars:
        description: "Additional Terraform variables to pass"
        required: false
        type: string
        default: ""
    # Callers pass `secrets: inherit`.
    outputs:
      plan_artifact_name:
        description: "Name of the uploaded plan artifact"
        value: ${{ jobs.plan.outputs.artifact_name }}

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ${{ inputs.runner }}
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    outputs:
      artifact_name: tf-plan-${{ inputs.workspace || inputs.environment }}
    env:
      TF_WORKSPACE: ${{ inputs.workspace || inputs.environment }}
      NODE_OPTIONS: "--no-network-family-autoselection"
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      PROXMOX_VE_PASSWORD: ${{ secrets.PROXMOX_VE_PASSWORD }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up SSH for Proxmox Provider
        if: inputs.enable_proxmox_ssh == true
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_proxmox
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          cli_config_credentials_token: ${{ secrets.HCP_API_TOKEN }}

      # Repo/env vars become TF_VAR_<lowercased name>. Secrets come from
      # Bitwarden (env/<env>/secrets.env), never the whole secrets context.
      - name: Export TF_VAR_*
        env:
          VARS: ${{ toJSON(vars) }}
        run: .github/scripts/export-tf-vars.sh >> "$GITHUB_ENV"

      # env/<env>/secrets.env: NAME=<bitwarden secret id> -> TF_VAR_<name>.
      - name: Read Bitwarden secret ids
        id: bws
        env:
          SECRETS_FILE: ${{ inputs.working_directory }}/${{ inputs.var_file_path }}
          HAS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN != '' }}
        run: .github/scripts/bws-secrets.sh "$(dirname "$SECRETS_FILE")/secrets.env" >> "$GITHUB_OUTPUT"

      - name: Fetch Bitwarden secrets
        if: steps.bws.outputs.secrets != ''
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: ${{ steps.bws.outputs.secrets }}

      - name: Terraform Init
        working-directory: ${{ inputs.working_directory }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ inputs.working_directory }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ inputs.working_directory }}
        run: terraform plan -input=false -var-file=${{ inputs.var_file_path }} ${{ inputs.terraform_vars }} -out=tfplan-${{ inputs.workspace || inputs.environment }}

      - name: Generate TF Plan Summary
        if: github.event_name == 'pull_request'
        working-directory: ${{ inputs.working_directory }}
        env:
          WS: ${{ inputs.workspace || inputs.environment }}
          ENV_NAME: ${{ inputs.environment }}
          DIR: ${{ inputs.working_directory }}
        run: |
          terraform show -json "tfplan-$WS" > plan.json
          summary=$("$GITHUB_WORKSPACE/.github/scripts/plan-summary.sh" plan.json "$WS" "$ENV_NAME" "$DIR")
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
          delim="EOF_$(openssl rand -hex 8)"
          printf 'PLAN_SUMMARY<<%s\n%s\n%s\n' "$delim" "$summary" "$delim" >> "$GITHUB_ENV"

      - name: Add TF Plan Summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.PLAN_SUMMARY
            })

      # Public repo: artifacts are downloadable by anyone signed in.
      - name: Encrypt TF Plan
        working-directory: ${{ inputs.working_directory }}
        env:
          PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
        run: |
          test -n "$PLAN_ENCRYPTION_KEY" || { echo "PLAN_ENCRYPTION_KEY is empty"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PLAN_ENCRYPTION_KEY \
            -in tfplan-${{ inputs.workspace || inputs.environment }} -out tfplan-${{ inputs.workspace || inputs.environment }}.enc
          rm -f tfplan-${{ inputs.workspace || inputs.environment }} plan.json

      - name: Upload TF Plan
        uses: actions/upload-artifact@v5
        with:
          name: tf-plan-${{ inputs.workspace || inputs.environment }}
          path: ${{ inputs.working_directory }}/tfplan-${{ inputs.workspace || inputs.environment }}.enc
          retention-days: 7

      - name: Remove plaintext plan
        if: always()
        working-directory: ${{ inputs.working_directory }}
        run: rm -f tfplan-${{ inputs.workspace || inputs.environment }} plan.json
