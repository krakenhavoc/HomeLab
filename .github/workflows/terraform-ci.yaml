name: Terraform CI

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Working directory for Terraform commands"
        required: true
        type: string
      var_file_path:
        description: "Path to tfvars file relative to working directory"
        required: true
        type: string
      environment:
        description: "GitHub environment (lab, dev, prd, platform, ...)"
        required: true
        type: string
      runner:
        description: "GitHub runner to use"
        required: false
        type: string
        default: "ubuntu-latest"
      enable_proxmox_ssh:
        description: "Start ssh-agent and add Proxmox key"
        required: false
        type: boolean
        default: false
      terraform_version:
        description: "Terraform version to use"
        required: false
        type: string
        default: "1.14.3"
      workspace:
        description: "Terraform Cloud workspace name"
        required: false
        type: string
        default: ""
      terraform_vars:
        description: "Additional Terraform variables to pass"
        required: false
        type: string
        default: ""
    # Callers pass `secrets: inherit`.
    outputs:
      plan_artifact_name:
        description: "Name of the uploaded plan artifact"
        value: ${{ jobs.plan.outputs.artifact_name }}

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ${{ inputs.runner }}
    environment:
      name: ${{ inputs.environment }}
      deployment: false
    outputs:
      artifact_name: tf-plan-${{ inputs.workspace || inputs.environment }}
    env:
      TF_WORKSPACE: ${{ inputs.workspace || inputs.environment }}
      NODE_OPTIONS: "--no-network-family-autoselection"
      PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      PROXMOX_VE_PASSWORD: ${{ secrets.PROXMOX_VE_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up SSH for Proxmox Provider
        if: inputs.enable_proxmox_ssh == true
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_proxmox
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: ${{ inputs.terraform_version }}
          cli_config_credentials_token: ${{ secrets.HCP_API_TOKEN }}

      # Every secret and var visible to the job becomes TF_VAR_<lowercased name>.
      - name: Export TF_VAR_*
        env:
          SECRETS: ${{ toJSON(secrets) }}
          VARS: ${{ toJSON(vars) }}
        run: |
          delim="EOF_$(openssl rand -hex 8)"
          jq -rn --arg d "$delim" --argjson s "$SECRETS" --argjson v "$VARS" '
            $v + $s | to_entries[]
            | select(.key | test("^[A-Za-z_][A-Za-z0-9_]*$"))
            | "TF_VAR_\(.key | ascii_downcase)<<\($d)\n\(.value)\n\($d)"
          ' >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: ${{ inputs.working_directory }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: ${{ inputs.working_directory }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ inputs.working_directory }}
        run: terraform plan -input=false -var-file=${{ inputs.var_file_path }} ${{ inputs.terraform_vars }} -out=tfplan-${{ inputs.workspace || inputs.environment }}

      - name: Generate TF Plan Summary
        if: github.event_name == 'pull_request'
        working-directory: ${{ inputs.working_directory }}
        run: |
          terraform show -json tfplan-${{ inputs.workspace || inputs.environment }} > plan.json

          ADD=$(jq '[.resource_changes[]? | select(.change.actions | index("create"))] | length // 0' plan.json)
          CHANGE=$(jq '[.resource_changes[]? | select(.change.actions | index("update"))] | length // 0' plan.json)
          DESTROY=$(jq '[.resource_changes[]? | select(.change.actions | index("delete"))] | length // 0' plan.json)

          TOTAL_CHANGES=$((ADD + CHANGE + DESTROY))

          echo "PLAN_SUMMARY<<EOF" >> $GITHUB_ENV
          echo "### Terraform Plan Summary (\`${{ inputs.workspace || inputs.environment }}\`)" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV

          if [ "$TOTAL_CHANGES" -eq "0" ]; then
            echo "✅ **No changes.** Infrastructure matches configuration." >> $GITHUB_ENV
          else
            echo "| Action | Count |" >> $GITHUB_ENV
            echo "|--------|-------|" >> $GITHUB_ENV
            echo "| ➕ Create | $ADD |" >> $GITHUB_ENV
            echo "| 🔁 Update | $CHANGE |" >> $GITHUB_ENV
            echo "| ❌ Destroy | $DESTROY |" >> $GITHUB_ENV
          fi

          echo "" >> $GITHUB_ENV
          echo "_Environment: \`${{ inputs.environment }}\` | Path: \`${{ inputs.working_directory }}\`_" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Add TF Plan Summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: process.env.PLAN_SUMMARY
            })

      # Public repo: artifacts are downloadable by anyone signed in.
      - name: Encrypt TF Plan
        working-directory: ${{ inputs.working_directory }}
        env:
          PLAN_ENCRYPTION_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
        run: |
          test -n "$PLAN_ENCRYPTION_KEY" || { echo "PLAN_ENCRYPTION_KEY is empty"; exit 1; }
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:PLAN_ENCRYPTION_KEY \
            -in tfplan-${{ inputs.workspace || inputs.environment }} -out tfplan-${{ inputs.workspace || inputs.environment }}.enc
          rm -f tfplan-${{ inputs.workspace || inputs.environment }} plan.json

      - name: Upload TF Plan
        uses: actions/upload-artifact@v5
        with:
          name: tf-plan-${{ inputs.workspace || inputs.environment }}
          path: ${{ inputs.working_directory }}/tfplan-${{ inputs.workspace || inputs.environment }}.enc
          retention-days: 7

      - name: Remove plaintext plan
        if: always()
        working-directory: ${{ inputs.working_directory }}
        run: rm -f tfplan-${{ inputs.workspace || inputs.environment }} plan.json
