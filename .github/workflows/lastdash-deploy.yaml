name: LastDash Deploy

permissions:
  contents: read
  pull-requests: write

on:
  push:
    paths:
      - "terraform/deployments/lastdash/**"
      - ".github/workflows/lastdash-deploy.yaml"
      - ".github/workflows/terraform-ci.yaml"
      - ".github/workflows/terraform-cd.yaml"
    branches:
      - main
  pull_request:
    paths:
      - "terraform/deployments/lastdash/**"
      - ".github/workflows/lastdash-deploy.yaml"
      - ".github/workflows/terraform-ci.yaml"
      - ".github/workflows/terraform-cd.yaml"

env:
  PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}

jobs:
  lastdash-ci:
    strategy:
      matrix:
        environment: ["lastdash-prod"]
    # Local ref, not a tag: the lastdash_* secret inputs were added to
    # terraform-ci in this change and exist in no release yet. Pin to the next
    # tag once one is cut.
    uses: ./.github/workflows/terraform-ci.yaml
    with:
      working_directory: terraform/deployments/lastdash
      var_file_path: env/${{ matrix.environment }}/terraform.tfvars
      environment: ${{ matrix.environment }}
      runner: self-hosted
      enable_proxmox_ssh: true
    secrets:
      hcp_api_token: ${{ secrets.HCP_API_TOKEN }}
      proxmox_ve_api_token: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      # Seeded into /etc/lastdash/env (and the GHCR login) by cloud-init.
      # GitHub environment secrets on `lastdash-prod`.
      lastdash_token_encryption_secret: ${{ secrets.LASTDASH_TOKEN_ENCRYPTION_SECRET }}
      lastdash_nextauth_secret: ${{ secrets.LASTDASH_NEXTAUTH_SECRET }}
      lastdash_postgres_password: ${{ secrets.LASTDASH_POSTGRES_PASSWORD }}
      lastdash_ghcr_token: ${{ secrets.LASTDASH_GHCR_TOKEN }}

  lastdash-cd:
    needs: lastdash-ci
    # Apply ONLY on a merge to main -- see frontends-deploy.yaml for why this
    # guard exists (an unreviewed PR plan once destroyed a production VM).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        environment: ["lastdash-prod"]
    uses: krakenhavoc/HomeLab/.github/workflows/terraform-cd.yaml@v0.2.0
    with:
      working_directory: terraform/deployments/lastdash
      environment: ${{ matrix.environment }}
      runner: self-hosted
      enable_proxmox_ssh: true
      plan_artifact_name: tf-plan-${{ matrix.environment }}
    secrets:
      hcp_api_token: ${{ secrets.HCP_API_TOKEN }}
      proxmox_ve_api_token: ${{ secrets.PROXMOX_VE_API_TOKEN }}
      # No lastdash_* secrets here, deliberately: terraform-cd declares none,
      # and passing an undeclared secret is a startup failure. The apply uses
      # the saved plan, which already carries the values.
