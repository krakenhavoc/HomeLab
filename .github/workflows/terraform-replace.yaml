name: Terraform Replace
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      replace_resource:
        description: "Resource address to recreate (e.g. module.vpc.aws_instance.web)"
        required: true
        default: ""
      app:
        description: "App under terraform/deployments (e.g. lab, plex, frontends)"
        required: true
        default: ""
      env:
        description: "Env under the app's env/ (lab, dev, prd)"
        required: true
        default: ""
      terraform_version:
        description: "Terraform version. Must satisfy the target module's required_version."
        required: false
        default: "1.14.3"
env:
  PROXMOX_VE_API_TOKEN: ${{ secrets.PROXMOX_VE_API_TOKEN }}

jobs:
  terraform-replace:
    runs-on: self-hosted
    environment: ${{ inputs.env }}
    env:
      # Same rule as deploy-matrix.sh.
      TF_WORKSPACE: ${{ inputs.app == inputs.env && inputs.app || format('{0}-{1}', inputs.app, inputs.env) }}
      NODE_OPTIONS: "--no-network-family-autoselection"
      PROXMOX_VE_PASSWORD: ${{ secrets.PROXMOX_VE_PASSWORD }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # bpg/proxmox reaches the node over SSH for snippet uploads and disk
      # operations. Without the agent the replace fails partway through.
      - name: Set up SSH for Proxmox Provider
        run: |
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_proxmox
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> $GITHUB_ENV

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          # Unpinned, setup-terraform installs the latest release, which fails
          # "Unsupported Terraform Core version" against a module pinning
          # required_version = "~> 1.14.3".
          terraform_version: ${{ inputs.terraform_version }}
          cli_config_credentials_token: ${{ secrets.HCP_API_TOKEN }}

      # Keep in step with terraform-ci's list.
      - name: Export TF_VAR_*
        env:
          VARS: ${{ toJSON(vars) }}
          TFSECRET_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TFSECRET_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TFSECRET_CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TFSECRET_CMD_AND_CTRL_ADMIN_TOKEN: ${{ secrets.CMD_AND_CTRL_ADMIN_TOKEN }}
          TFSECRET_CMD_AND_CTRL_DEV_ADMIN_TOKEN: ${{ secrets.CMD_AND_CTRL_DEV_ADMIN_TOKEN }}
          TFSECRET_CMD_AND_CTRL_GITHUB_TOKEN: ${{ secrets.CMD_AND_CTRL_GITHUB_TOKEN }}
          TFSECRET_CMD_AND_CTRL_TUNNEL_TOKEN: ${{ secrets.CMD_AND_CTRL_TUNNEL_TOKEN }}
          TFSECRET_LASTDASH_GHCR_TOKEN: ${{ secrets.LASTDASH_GHCR_TOKEN }}
          TFSECRET_LASTDASH_NEXTAUTH_SECRET: ${{ secrets.LASTDASH_NEXTAUTH_SECRET }}
          TFSECRET_LASTDASH_POSTGRES_PASSWORD: ${{ secrets.LASTDASH_POSTGRES_PASSWORD }}
          TFSECRET_LASTDASH_TOKEN_ENCRYPTION_SECRET: ${{ secrets.LASTDASH_TOKEN_ENCRYPTION_SECRET }}
        run: .github/scripts/export-tf-vars.sh >> "$GITHUB_ENV"

      - name: Terraform Init
        working-directory: terraform/deployments/${{ inputs.app }}
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform/deployments/${{ inputs.app }}
        run: terraform validate

      - name: Terraform Apply
        working-directory: terraform/deployments/${{ inputs.app }}
        env:
          # Passed through the environment rather than interpolated into the
          # script body. Interpolating mangles a quoted index bracket --
          # cmd_and_ctrl["dev"] reaches terraform as cmd_and_ctrl[dev], which it
          # rejects with "Index brackets must contain ... a literal string" --
          # and it also lets a dispatch input inject arbitrary shell.
          REPLACE_RESOURCE: ${{ inputs.replace_resource }}
          VAR_FILE: env/${{ inputs.env }}/terraform.tfvars
        run: |
          set -eu
          # Build argv so the address survives word splitting intact.
          if [ -n "$REPLACE_RESOURCE" ]; then
            set -- -replace="$REPLACE_RESOURCE"
          else
            set --
          fi
          # Print the plan first. This applies without a review gate by design,
          # being a break-glass tool, so the log must record what it decided.
          terraform plan "$@" -var-file="$VAR_FILE" -no-color
          terraform apply -auto-approve "$@" -var-file="$VAR_FILE"
